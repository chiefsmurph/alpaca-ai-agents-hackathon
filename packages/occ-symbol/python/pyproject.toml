[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "occ-symbol"
version = "0.1.1"
description = "Parse, validate, and build OCC option symbols — SPY260825C00500000 ⇄ {underlying, expiration, right, strike}. Zero dependencies, stdlib only."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "John Murphy", email = "chiefsmurph@gmail.com" }]
keywords = [
    "occ",
    "option-symbol",
    "options",
    "options-trading",
    "osi",
    "option-parser",
    "derivatives",
    "finance",
    "trading",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://occsymbol.com"
"Live demo" = "https://occsymbol.com"
Repository = "https://github.com/chiefsmurph/occ-symbol"
Issues = "https://github.com/chiefsmurph/occ-symbol/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/occ_symbol"]

[tool.pytest.ini_options]
testpaths = ["tests"]
